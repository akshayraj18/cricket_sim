# Dependabot keeps dependencies current and lets GitHub fully resolve the
# dependency graph (the uv workspace otherwise trips its per-directory crawl).
# Updates are grouped and rate-limited so we don't get a flood of PRs.
version: 2
updates:
  # Python backend + sim engine (uv workspace; root uv.lock covers all members).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Expo / React Native mobile app. Expo SDK + React Native packages are
  # version-locked to the Expo SDK and must be upgraded together via
  # `npx expo install` / an SDK bump — NOT bumped individually by Dependabot
  # (which breaks the app and desyncs package-lock.json from `npm ci`). So we
  # ignore those and let Dependabot handle only the non-Expo libraries.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mobile-dependencies:
        patterns:
          - "*"
    ignore:
      # Expo SDK + React Native are SDK-locked — upgrade via `npx expo install`.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/*"
      # eslint-config-expo pins the compatible eslint major; a raw major bump
      # (e.g. eslint 9 -> 10) breaks `expo lint`. Ignore lint-toolchain majors;
      # patch/minor updates still come through.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
