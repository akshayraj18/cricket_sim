[project]
name = "cricket-sim-engine"
version = "0.1.0"
description = "Core IPL franchise simulation engine: match engine, league state, and player datasets"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricket_sim_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/cricket_sim_engine/players.csv" = "cricket_sim_engine/players.csv"
"src/cricket_sim_engine/players_alltime.csv" = "cricket_sim_engine/players_alltime.csv"
