services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cricket_sim
      POSTGRES_PASSWORD: cricket_sim
      POSTGRES_DB: cricket_sim
    ports:
      - "5432:5432"
    volumes:
      - cricket_sim_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricket_sim"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cricket_sim_postgres:
