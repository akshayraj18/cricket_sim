[project]
name = "cricket-sim-backend"
version = "0.1.0"
description = "FastAPI backend for the IPL franchise sim: auth, careers, live match, subscriptions"
requires-python = ">=3.12"
dependencies = [
    "cricket-sim-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.28",
    "sentry-sdk[fastapi]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
cricket-sim-engine = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
