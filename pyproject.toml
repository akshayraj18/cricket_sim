[project]
name = "cricket-sim"
version = "0.1.0"
description = "Cricket franchise career simulation: engine, legacy web UI, and FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "cricket-sim-engine",
    "kagglehub>=1.0.2",
    "pandas>=3.0.3",
]

[dependency-groups]
dev = [
    "pyflakes>=3.0",
    "pytest>=9.0.3",
]

[tool.uv.workspace]
members = ["packages/*", "backend"]

[tool.uv.sources]
cricket-sim-engine = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "legacy/tests"]
addopts = "-ra"
markers = [
    "unit: fast, isolated tests of pure functions/classes (no LeagueState/match scaffolding)",
    "integration: tests that exercise LeagueState/LiveMatch/ui_server flows together",
    "regression: slower end-to-end tests that guard whole-career/season behaviour",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legacy", "tests"]
