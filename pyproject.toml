[project]
name = "cricket-sim"
version = "0.1.0"
description = "Cricket franchise career simulation: engine and FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "cricket-sim-engine",
]

[dependency-groups]
dev = [
    "pyflakes>=3.0",
    "pytest>=9.1.1",
]

[tool.uv.workspace]
members = ["packages/*", "backend"]

[tool.uv.sources]
cricket-sim-engine = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast, isolated tests of pure functions/classes (no LeagueState/match scaffolding)",
    "integration: tests that exercise LeagueState/LiveMatch flows together",
    "regression: slower end-to-end tests that guard whole-career/season behaviour",
    "slow: takes multiple seconds on its own (full Test matches, multi-season sims). Excluded from `make test-fast`; always run in CI before merge.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tests"]
